<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 500" width="760" height="500" font-family="Arial, Helvetica, sans-serif" xmlns:c2pa="http://c2pa.org/manifest">
  <title>Wiring Game Mengingat ESP32 dengan 4 LED</title>

  <!-- Latar -->
  <rect x="1" y="1" width="758" height="498" rx="12" fill="#ffffff" stroke="#dddddd"/>
  <text x="380" y="38" text-anchor="middle" font-size="20" font-weight="bold" fill="#222222">Wiring Game Mengingat ESP32</text>

  <!-- Papan ESP32 -->
  <rect x="40" y="70" width="150" height="350" rx="10" fill="#263238" stroke="#111111" stroke-width="2"/>
  <text x="115" y="102" text-anchor="middle" font-size="18" font-weight="bold" fill="#ffffff">ESP32</text>
  <text x="115" y="122" text-anchor="middle" font-size="12" fill="#b0bec5">DevKit</text>
  <text x="115" y="408" text-anchor="middle" font-size="11" fill="#b0bec5">USB ke laptop</text>

  <!-- Jalur GND -->
  <line x1="190" y1="395" x2="600" y2="395" stroke="#444444" stroke-width="3"/>
  <line x1="600" y1="160" x2="600" y2="395" stroke="#444444" stroke-width="4"/>
  <circle cx="190" cy="395" r="5" fill="#90a4ae" stroke="#444444"/>
  <text x="180" y="399" text-anchor="end" font-size="13" fill="#ffffff">GND</text>
  <circle cx="600" cy="395" r="5" fill="#444444"/>
  <text x="600" y="418" text-anchor="middle" font-size="13" font-weight="bold" fill="#222222">GND (satu jalur)</text>

  <!-- Baris 1: GPIO 16 - Merah -->
  <circle cx="190" cy="160" r="5" fill="#ffd54f" stroke="#444444"/>
  <text x="180" y="164" text-anchor="end" font-size="13" fill="#ffffff">GPIO 16</text>
  <line x1="190" y1="160" x2="250" y2="160" stroke="#444444" stroke-width="2"/>
  <rect x="250" y="148" width="70" height="24" rx="3" fill="#fff3e0" stroke="#8d6e63" stroke-width="2"/>
  <text x="285" y="164" text-anchor="middle" font-size="12" fill="#333333">220Ω</text>
  <line x1="320" y1="160" x2="400" y2="160" stroke="#444444" stroke-width="2"/>
  <polygon points="400,144 400,176 432,160" fill="#e53935" stroke="#333333" stroke-width="2"/>
  <line x1="432" y1="144" x2="432" y2="176" stroke="#333333" stroke-width="3"/>
  <line x1="432" y1="160" x2="600" y2="160" stroke="#444444" stroke-width="2"/>
  <circle cx="600" cy="160" r="4" fill="#444444"/>
  <text x="392" y="154" text-anchor="end" font-size="12" fill="#555555">+</text>
  <text x="440" y="154" font-size="12" fill="#555555">−</text>
  <text x="416" y="194" text-anchor="middle" font-size="12" fill="#333333">LED Merah</text>
  <text x="516" y="152" text-anchor="middle" font-size="12" fill="#555555">Tombol web 1</text>

  <!-- Baris 2: GPIO 17 - Hijau -->
  <circle cx="190" cy="220" r="5" fill="#ffd54f" stroke="#444444"/>
  <text x="180" y="224" text-anchor="end" font-size="13" fill="#ffffff">GPIO 17</text>
  <line x1="190" y1="220" x2="250" y2="220" stroke="#444444" stroke-width="2"/>
  <rect x="250" y="208" width="70" height="24" rx="3" fill="#fff3e0" stroke="#8d6e63" stroke-width="2"/>
  <text x="285" y="224" text-anchor="middle" font-size="12" fill="#333333">220Ω</text>
  <line x1="320" y1="220" x2="400" y2="220" stroke="#444444" stroke-width="2"/>
  <polygon points="400,204 400,236 432,220" fill="#43a047" stroke="#333333" stroke-width="2"/>
  <line x1="432" y1="204" x2="432" y2="236" stroke="#333333" stroke-width="3"/>
  <line x1="432" y1="220" x2="600" y2="220" stroke="#444444" stroke-width="2"/>
  <circle cx="600" cy="220" r="4" fill="#444444"/>
  <text x="392" y="214" text-anchor="end" font-size="12" fill="#555555">+</text>
  <text x="440" y="214" font-size="12" fill="#555555">−</text>
  <text x="416" y="254" text-anchor="middle" font-size="12" fill="#333333">LED Hijau</text>
  <text x="516" y="212" text-anchor="middle" font-size="12" fill="#555555">Tombol web 2</text>

  <!-- Baris 3: GPIO 18 - Biru -->
  <circle cx="190" cy="280" r="5" fill="#ffd54f" stroke="#444444"/>
  <text x="180" y="284" text-anchor="end" font-size="13" fill="#ffffff">GPIO 18</text>
  <line x1="190" y1="280" x2="250" y2="280" stroke="#444444" stroke-width="2"/>
  <rect x="250" y="268" width="70" height="24" rx="3" fill="#fff3e0" stroke="#8d6e63" stroke-width="2"/>
  <text x="285" y="284" text-anchor="middle" font-size="12" fill="#333333">220Ω</text>
  <line x1="320" y1="280" x2="400" y2="280" stroke="#444444" stroke-width="2"/>
  <polygon points="400,264 400,296 432,280" fill="#1e88e5" stroke="#333333" stroke-width="2"/>
  <line x1="432" y1="264" x2="432" y2="296" stroke="#333333" stroke-width="3"/>
  <line x1="432" y1="280" x2="600" y2="280" stroke="#444444" stroke-width="2"/>
  <circle cx="600" cy="280" r="4" fill="#444444"/>
  <text x="392" y="274" text-anchor="end" font-size="12" fill="#555555">+</text>
  <text x="440" y="274" font-size="12" fill="#555555">−</text>
  <text x="416" y="314" text-anchor="middle" font-size="12" fill="#333333">LED Biru</text>
  <text x="516" y="272" text-anchor="middle" font-size="12" fill="#555555">Tombol web 3</text>

  <!-- Baris 4: GPIO 19 - Kuning -->
  <circle cx="190" cy="340" r="5" fill="#ffd54f" stroke="#444444"/>
  <text x="180" y="344" text-anchor="end" font-size="13" fill="#ffffff">GPIO 19</text>
  <line x1="190" y1="340" x2="250" y2="340" stroke="#444444" stroke-width="2"/>
  <rect x="250" y="328" width="70" height="24" rx="3" fill="#fff3e0" stroke="#8d6e63" stroke-width="2"/>
  <text x="285" y="344" text-anchor="middle" font-size="12" fill="#333333">220Ω</text>
  <line x1="320" y1="340" x2="400" y2="340" stroke="#444444" stroke-width="2"/>
  <polygon points="400,324 400,356 432,340" fill="#fdd835" stroke="#333333" stroke-width="2"/>
  <line x1="432" y1="324" x2="432" y2="356" stroke="#333333" stroke-width="3"/>
  <line x1="432" y1="340" x2="600" y2="340" stroke="#444444" stroke-width="2"/>
  <circle cx="600" cy="340" r="4" fill="#444444"/>
  <text x="392" y="334" text-anchor="end" font-size="12" fill="#555555">+</text>
  <text x="440" y="334" font-size="12" fill="#555555">−</text>
  <text x="416" y="374" text-anchor="middle" font-size="12" fill="#333333">LED Kuning</text>
  <text x="516" y="332" text-anchor="middle" font-size="12" fill="#555555">Tombol web 4</text>

  <!-- Catatan -->
  <text x="40" y="452" font-size="12" fill="#444444">Tiap LED: GPIO → resistor 220Ω → anoda (kaki panjang, +) → katoda (kaki pendek, −) → GND.</text>
  <text x="40" y="472" font-size="12" fill="#444444">Tidak ada buzzer dan tombol fisik. Pin VCC/3V3/5V tidak dipakai, daya dari USB.</text>
  <text x="40" y="490" font-size="12" fill="#444444">Warna LED harus sesuai urutan di atas agar cocok dengan warna tombol di halaman web.</text>
<metadata><c2pa:manifest></c2pa:manifest></metadata></svg>
